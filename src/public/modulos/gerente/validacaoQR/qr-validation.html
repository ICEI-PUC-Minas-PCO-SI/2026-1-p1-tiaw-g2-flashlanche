<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Validação de QR Codes</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  
  <link rel="stylesheet" href="../../../styles.css"/>
  <link rel="stylesheet" href="qr-validation.css"/>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="manager-layout">
  <!-- ═════════════════════════════════════════════════════SIDEBAR═══════════════════════════════════════ -->
  <aside class="sidebar">
    <a href="#" class="sidebar-logo">
      <div class="sidebar-logo-mark"><i class="bi bi-bag-heart-fill"></i></div>
      FlashLanche
    </a>

    <nav class="sidebar-nav">
      <li><a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li><a href="../produtos/products.html"><i class="bi bi-box-seam"></i> Produtos</a></li>
      <li><a href="../pedidos/orders.html"><i class="bi bi-receipt"></i> Pedidos</a></li>
      <li><a href="../horarios/timeslots.html"><i class="bi bi-calendar-event"></i> Horários</a></li>
      <li><a href="../estoque/stock.html"><i class="bi bi-stack"></i> Estoque</a></li>
      <li><a href="qr-validation.html" class="active"><i class="bi bi-qr-code-scan"></i> QR Codes</a></li>
      <li><a href="../cupoms/cupom.html"><i class="bi bi-ticket"></i> Cupons</a></li>
      <li><a href="../relatorios/reports.html"><i class="bi bi-bar-chart"></i> Relatórios</a></li>
    </nav>

    <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
  </aside>

  <!-- ═════════════════════════════════════════════════════CONTENT═══════════════════════════════════════ -->
  <main class="content">
    <div class="top-bar">
      <h1 class="page-title"><i class="bi bi-qr-code-scan"></i> Validação de QR Codes</h1>
    </div>

    <!-- ═════════════════════════════════════════════════════SCANNER════════════════════════════════════════════════════════════ -->
    <div class="scanner-box">
      <label class="form-label"><i class="bi bi-qr-code"></i> Código QR ou ID</label>
      
      <div style="display: flex; gap: 10px; margin-bottom: 16px;">
        <input type="text" id="qr-input" class="form-input" placeholder="Cole o texto do QR aqui ou use a câmera..." autofocus>
        
        <button class="btn-camera" onclick="abrirCamera()" id="btn-abrir-camera">
          <i class="bi bi-camera"></i> Câmera
        </button>
      </div>
      
      <button class="btn-scan" onclick="validarQR()">
        <i class="bi bi-check-circle"></i> Validar e Marcar como Retirado
      </button>

      <div id="camera-container" style="display: none; margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 0;">Escaneando...</h3>
          <button class="btn-action btn-action-danger" onclick="fecharCamera()">Cancelar</button>
        </div>
        <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid var(--orange);"></div>
      </div>
    </div>

    <!-- ═════════════════════════════════════════════════════RESULTADO VALIDACAO════════════════════════════════════════════════════════════ -->
    <div id="result-container"></div>

<!-- CRUD DE PEDIDOS -->
<div class="scanner-box">
  <h2 style="margin-bottom:20px;">
    <i class="bi bi-pencil-square"></i>
    Gerenciar Pedidos
  </h2>

  <div style="display:grid; gap:12px;">
    <input type="text" id="pedido-id" class="form-input" placeholder="ID do Pedido">

    <input type="text" id="pedido-cliente" class="form-input" placeholder="Nome do Cliente">

    <input type="number" id="pedido-total" class="form-input" placeholder="Valor Total">

    <select id="pedido-status" class="form-input">
      <option value="Pendente">Pendente</option>
      <option value="Preparando">Preparando</option>
      <option value="Pronto">Pronto</option>
      <option value="Retirado">Retirado</option>
    </select>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-action" onclick="criarPedidoManual()">
        Criar
      </button>

      <button class="btn-action" onclick="buscarPedido()">
        Buscar
      </button>

      <button class="btn-action" onclick="atualizarPedido()">
        Atualizar
      </button>

      <button class="btn-action btn-action-danger" onclick="deletarPedidoManual()">
        Excluir
      </button>
    </div>
  </div>
</div>

    <!-- ═════════════════════════════════════════════════════ULTIMOS QR VALIDADOS════════════════════════════════════════════════════════════ -->
    <h2 style="font-size: 18px; font-weight: 700; margin: 32px 0 16px;">Histórico de QRs Escaneados</h2>
    <div class="table-container">
      <table class="qr-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Pedido</th>
            <th>Status</th>
            <th>Retirado em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="qr-history">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-secondary);">Nenhum QR escaneado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="../../../db/db.js"></script>
<script src="qr-validation.js"></script>


</body>
</html>
