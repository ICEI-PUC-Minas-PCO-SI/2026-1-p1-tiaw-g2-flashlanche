<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Validação de QR Codes</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD: exige login + privilégio de gerente -->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ exigirAdmin: true, caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="qr-validation.css" />
</head>
<body>

<div class="manager-layout">

  <!-- ═══════════════════════════ SIDEBAR ═══════════════════════════ -->
  <aside class="sidebar">
    <a href="#" class="sidebar-logo">
      <div class="sidebar-logo-mark" aria-hidden="true">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      FlashLanche
    </a>

    <nav class="sidebar-nav" aria-label="Navegação do gestor">
      <ul style="list-style: none; margin: 0; padding: 0;">
        <li><a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a></li>
        <li><a href="../produtos/products.html"><i class="bi bi-box-seam" aria-hidden="true"></i> Produtos</a></li>
        <li><a href="../pedidos/orders.html"><i class="bi bi-receipt" aria-hidden="true"></i> Pedidos</a></li>
        <li><a href="../horarios/timeslots.html"><i class="bi bi-calendar-event" aria-hidden="true"></i> Horários</a></li>
        <li><a href="../estoque/stock.html"><i class="bi bi-stack" aria-hidden="true"></i> Estoque</a></li>
        <li><a href="qr-validation.html" class="active" aria-current="page"><i class="bi bi-qr-code-scan" aria-hidden="true"></i> QR Codes</a></li>
        <li><a href="../cupoms/cupom.html"><i class="bi bi-ticket" aria-hidden="true"></i> Cupons</a></li>
        <li><a href="../relatorios/reports.html"><i class="bi bi-bar-chart" aria-hidden="true"></i> Relatórios</a></li>
      </ul>
    </nav>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
    </button>
  </aside>

  <!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
  <main class="content">

    <div class="top-bar">
      <div class="top-bar-left">
        <button type="button" id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Ocultar menu lateral" title="Ocultar menu lateral">
          <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
        </button>
        <h1 class="page-title">
          <i class="bi bi-qr-code-scan" aria-hidden="true"></i> Validação de QR Codes
        </h1>
      </div>
    </div>

    <!-- Scanner -->
    <section class="scanner-box" aria-label="Validar código QR">
      <label class="form-label" for="qr-input">
        <i class="bi bi-qr-code" aria-hidden="true"></i> Código QR ou ID
      </label>

      <div class="scanner-input-row">
        <input
          type="text"
          id="qr-input"
          class="form-input"
          placeholder="Cole o texto do QR aqui ou use a câmera..."
          autofocus
        />
        <button class="btn-camera" onclick="abrirCamera()" id="btn-abrir-camera">
          <i class="bi bi-camera" aria-hidden="true"></i> Câmera
        </button>
      </div>

      <button class="btn-scan" onclick="validarQR()">
        <i class="bi bi-check-circle" aria-hidden="true"></i> Validar e Marcar como Retirado
      </button>

      <div class="camera-container" id="camera-container">
        <div class="camera-header">
          <h3>Escaneando...</h3>
          <button class="btn-action btn-action-danger" onclick="fecharCamera()">Cancelar</button>
        </div>
        <div id="reader" class="camera-reader" aria-label="Visualização da câmera para leitura de QR Code"></div>
      </div>
    </section>

    <!-- Resultado da validação -->
    <div id="result-container" aria-live="polite"></div>

    <!-- Histórico -->
    <h2 class="section-title">Histórico de QRs Escaneados</h2>
    <div class="table-container">
      <table class="qr-table">
        <thead>
          <tr>
            <th scope="col">Código</th>
            <th scope="col">Pedido</th>
            <th scope="col">Status</th>
            <th scope="col">Retirado em</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="qr-history">
          <tr>
            <td colspan="5" class="cell-empty">Nenhum QR escaneado</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget-gestor" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>
  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
    <button type="button" class="tts-close-btn" aria-label="Ocultar leitor de página" title="Ocultar leitor de página">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
<script>inicializarTTSToggle('.tts-widget-gestor');</script>
<script>inicializarSidebarToggle();</script>

<script src="../../../db/db.js"></script>
<script src="qr-validation.js"></script>
</body>
</html>
