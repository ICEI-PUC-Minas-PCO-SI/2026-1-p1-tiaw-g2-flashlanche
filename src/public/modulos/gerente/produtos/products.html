<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Gerenciamento de Produtos</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD-->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ exigirAdmin: true, caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="products.css" />
</head>
<body>

<div class="manager-layout">

  <!-- ═══════════════════════════ SIDEBAR ═══════════════════════════ -->
  <aside class="sidebar">
    <a href="#" class="sidebar-logo">
      <div class="sidebar-logo-mark" aria-hidden="true">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      FlashLanche
    </a>

    <nav class="sidebar-nav" aria-label="Navegação do gestor">
      <ul style="list-style: none; margin: 0; padding: 0;">
        <li><a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a></li>
        <li><a href="products.html" class="active" aria-current="page"><i class="bi bi-box-seam" aria-hidden="true"></i> Produtos</a></li>
        <li><a href="../pedidos/orders.html"><i class="bi bi-receipt" aria-hidden="true"></i> Pedidos</a></li>
        <li><a href="../horarios/timeslots.html"><i class="bi bi-calendar-event" aria-hidden="true"></i> Horários</a></li>
        <li><a href="../estoque/stock.html"><i class="bi bi-stack" aria-hidden="true"></i> Estoque</a></li>
        <li><a href="../validacaoQR/qr-validation.html"><i class="bi bi-qr-code-scan" aria-hidden="true"></i> QR Codes</a></li>
        <li><a href="../cupoms/cupom.html"><i class="bi bi-ticket" aria-hidden="true"></i> Cupons</a></li>
        <li><a href="../relatorios/reports.html"><i class="bi bi-bar-chart" aria-hidden="true"></i> Relatórios</a></li>
      </ul>
    </nav>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
    </button>
  </aside>

  <!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
  <main class="content">

    <div class="top-bar">
      <h1 class="page-title">
        <i class="bi bi-box-seam" aria-hidden="true"></i> Produtos
      </h1>
      <button class="btn-novo" onclick="abrirModal()">
        <i class="bi bi-plus-circle" aria-hidden="true"></i> Novo Produto
      </button>
    </div>

    <div class="products-grid" id="products-grid" role="list" aria-label="Lista de produtos"></div>

  </main>
</div>

<!-- ═══════════════════════════ MODAL FORMULÁRIO ═══════════════════════════ -->
<div
  class="modal"
  id="modal-form"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
  aria-hidden="true"
>
  <div class="modal-content">
    <h2 class="modal-header" id="modal-title">Novo Produto</h2>

    <div class="form-group">
      <label class="form-label" for="nome">Nome</label>
      <input type="text" id="nome" class="form-input" placeholder="Ex: Misto Quente" />
    </div>

    <div class="form-group">
      <label class="form-label" for="descricao">Descrição</label>
      <input type="text" id="descricao" class="form-input" placeholder="Ex: Pão de queijo quente" />
    </div>

    <div class="form-group">
      <label class="form-label" for="preco">Preço (R$)</label>
      <input type="number" id="preco" class="form-input" placeholder="8.50" step="0.01" min="0" />
    </div>

    <div class="form-group">
      <label class="form-label" for="categoria">Categoria</label>
      <select id="categoria" class="form-input">
        <option value="lanches">Lanches</option>
        <option value="bebidas">Bebidas</option>
        <option value="refeições">Refeições</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="imagem">Emoji/Ícone</label>
      <input type="text" id="imagem" class="form-input" placeholder="🥪" />
    </div>

    <button class="btn-submit" id="btn-save" onclick="salvarProduto()">Adicionar Produto</button>
    <button class="btn-submit btn-submit--secondary" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget-gestor" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>
  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
</div>

<script src="../../../db/db.js"></script>
<script src="products.js"></script>
</body>
</html>
