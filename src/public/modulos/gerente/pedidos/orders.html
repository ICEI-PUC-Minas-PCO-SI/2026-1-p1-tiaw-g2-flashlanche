<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Gerenciamento de Pedidos</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD-->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ exigirAdmin: true, caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="orders.css" />
</head>
<body>

<div class="manager-layout">

  <!-- ═══════════════════════════ SIDEBAR ═══════════════════════════ -->
  <aside class="sidebar">
    <a href="#" class="sidebar-logo">
      <div class="sidebar-logo-mark" aria-hidden="true">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      FlashLanche
    </a>

    <nav class="sidebar-nav" aria-label="Navegação do gestor">
      <ul style="list-style: none; margin: 0; padding: 0;">
        <li><a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a></li>
        <li><a href="../produtos/products.html"><i class="bi bi-box-seam" aria-hidden="true"></i> Produtos</a></li>
        <li><a href="orders.html" class="active" aria-current="page"><i class="bi bi-receipt" aria-hidden="true"></i> Pedidos</a></li>
        <li><a href="../horarios/timeslots.html"><i class="bi bi-calendar-event" aria-hidden="true"></i> Horários</a></li>
        <li><a href="../estoque/stock.html"><i class="bi bi-stack" aria-hidden="true"></i> Estoque</a></li>
        <li><a href="../validacaoQR/qr-validation.html"><i class="bi bi-qr-code-scan" aria-hidden="true"></i> QR Codes</a></li>
        <li><a href="../cupoms/cupom.html"><i class="bi bi-ticket" aria-hidden="true"></i> Cupons</a></li>
        <li><a href="../relatorios/reports.html"><i class="bi bi-bar-chart" aria-hidden="true"></i> Relatórios</a></li>
      </ul>
    </nav>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
    </button>
  </aside>

  <!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
  <main class="content">

    <div class="top-bar">
      <h1 class="page-title">
        <i class="bi bi-receipt" aria-hidden="true"></i> Pedidos
      </h1>
      <div class="top-bar-actions">
        <label class="visually-hidden" for="filter-status">Filtrar por status</label>
        <select id="filter-status" class="form-select filter-select" onchange="filtrarPedidos()">
          <option value="">Todos os Status</option>
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="preparando">Preparando</option>
          <option value="pronto">Pronto</option>
          <option value="retirado">Retirado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table class="orders-table">
        <thead>
          <tr>
            <th scope="col">Pedido</th>
            <th scope="col">Cliente</th>
            <th scope="col">Itens</th>
            <th scope="col">Total</th>
            <th scope="col">Status</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="orders-body">
          <tr>
            <td colspan="6" class="cell-empty">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ═══════════════════════════ MODAL DE DETALHES ═══════════════════════════ -->
<div
  class="modal"
  id="modal-detalhes"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-titulo"
  aria-hidden="true"
>
  <div class="modal-content">
    <h2 class="modal-header" id="modal-titulo">Detalhes do Pedido</h2>

    <div class="modal-field">
      <div class="modal-field-label">ID do Pedido</div>
      <div class="modal-field-value" id="modal-id">PED-12345678</div>
    </div>

    <div class="modal-field">
      <div class="modal-field-label">Cliente</div>
      <div id="modal-cliente">---</div>
    </div>

    <div class="modal-field">
      <div class="modal-field-label">Itens</div>
      <div id="modal-itens"></div>
    </div>

    <div class="form-group">
      <label class="form-label" for="modal-status">Status Atual</label>
      <select id="modal-status" class="form-select"></select>
    </div>

    <button class="btn-submit" onclick="salvarAlteracao()">Salvar Alteração</button>
    <button class="btn-submit btn-submit--secondary" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget-gestor" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>
  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
</div>

<script src="../../../db/db.js"></script>
<script src="orders.js"></script>
</body>
</html>
