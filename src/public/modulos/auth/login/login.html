<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Entrar</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="../auth.css" />
</head>
<body>

<!-- ═════════════════════════════════════════════════════TOP NAV════════════════════════════════════════════════════════════ -->
<main>
  <section class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon"><i class="bi bi-person-circle"></i></div>
        <h1 class="h1-text">Bem-vindo de volta</h1>
        <p class="auth-sub">Entre com sua conta para pedir no FlashLanche</p>
      </div>

      <form id="login-form" novalidate>

        <div class="mb-3">
          <label for="login-username" class="form-label">Usuário</label>
          <input type="text" class="form-control auth-input" id="login-username" placeholder="Digite seu usuário" autocomplete="username" required>
        </div>

        <div class="mb-2">
          <label for="login-password" class="form-label">Senha</label>
          <div class="auth-password-wrap">
            <input type="password" class="form-control auth-input" id="login-password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" class="auth-toggle-pass" id="toggle-password" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div id="login-error" class="auth-error" style="display:none;"></div>

        <button type="submit" class="btn-primary-cb auth-submit">
          <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>

        <div class="auth-hint">
          <i class="bi bi-info-circle"></i>
          Usuários de teste: <code>user / 123</code> (cliente) ou <code>admin / 123</code> (gerente)
        </div>

      </form>

      <div class="auth-footer">
        Ainda não tem conta? <a href="../cadastro/cadastro.html">Cadastre-se</a>
      </div>

    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../db/auth.js"></script>
<script src="login.js"></script>
</body>
</html>
