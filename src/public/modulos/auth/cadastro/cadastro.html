<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Criar Conta</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="../auth.css" />
</head>
<body>

<!-- ═════════════════════════════════════════════════════TOP NAV════════════════════════════════════════════════════════════ -->
<main>
  <section class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <h1 class="h1-text">Criar sua conta</h1>
        <p class="auth-sub">Leva menos de 1 minuto para começar a pedir</p>
      </div>

      <form id="cadastro-form" novalidate>

        <div class="mb-3">
          <label for="cadastro-username" class="form-label">Usuário</label>
          <input type="text" class="form-control auth-input" id="cadastro-username" placeholder="Escolha um nome de usuário" autocomplete="username" required minlength="3">
        </div>

        <div class="mb-3">
          <label for="cadastro-email" class="form-label">E-mail</label>
          <input type="email" class="form-control auth-input" id="cadastro-email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label for="cadastro-telefone" class="form-label">Telefone</label>
          <input type="tel" class="form-control auth-input" id="cadastro-telefone" placeholder="(DDD) 91234-5678" autocomplete="tel" required>
        </div>

        <div class="mb-3">
          <label for="cadastro-password" class="form-label">Senha</label>
          <div class="auth-password-wrap">
            <input type="password" class="form-control auth-input" id="cadastro-password" placeholder="Crie uma senha" autocomplete="new-password" required minlength="3">
            <button type="button" class="auth-toggle-pass" id="toggle-password" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-2">
          <label for="cadastro-confirm" class="form-label">Confirmar senha</label>
          <input type="password" class="form-control auth-input" id="cadastro-confirm" placeholder="Repita a senha" autocomplete="new-password" required>
        </div>

        <div id="cadastro-error" class="auth-error" style="display:none;"></div>

        <button type="submit" class="btn-primary-cb auth-submit">
          <i class="bi bi-person-plus-fill"></i> Criar conta
        </button>

      </form>

      <div class="auth-footer">
        Já tem conta? <a href="../login/login.html">Entrar</a>
      </div>

    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../db/auth.js"></script>
<script src="cadastro.js"></script>
</body>
</html>
