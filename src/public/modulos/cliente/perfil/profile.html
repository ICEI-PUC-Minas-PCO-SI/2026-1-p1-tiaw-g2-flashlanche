<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Meu Perfil</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="profile.css" />

</head>
<body>

<!-- ═════════════════════════════════════════════════════TOP NAV════════════════════════════════════════════════════════════ -->
<nav class="top-nav">
  <div class="container">
    <div class="nav-container">
      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark"><i class="bi bi-bag-heart-fill"></i></div>
        <span class="logo-name">Flash<span>Lanche</span></span>
      </a>
      <div class="nav-actions">
        <button class="nav-btn" onclick="irParaLoja()"><i class="bi bi-shop"></i> Cardápio</button>
        <button class="nav-btn" onclick="irParaPedidos()"><i class="bi bi-clock-history"></i> Meus Pedidos</button>
        <button class="nav-btn login-btn" onclick="voltarHome()"><i class="bi bi-house-door"></i> Voltar</button>
      </div>
    </div>
  </div>
</nav>

<!-- ═════════════════════════════════════════════════════PERFIL HEADER════════════════════════════════════════════════════════════ -->
<section class="profile-container">
  <div class="container">

    <div class="profile-header">
      <div class="profile-avatar"><i class="bi bi-person-fill"></i></div>
      <div class="profile-info">
        <h1 class="h1-text">Meu Perfil</h1>
        <p style="color: var(--text-secondary); margin-top: 6px;">Gerencie os produtos que você marcou como favoritos</p>
      </div>
    </div>

    <!-- ═════════════════════════════════════════════════════FAVORITOS HEADER════════════════════════════════════════════════════════════ -->
    <div class="section-header">
      <div>
        <h2 class="h2-text">Meus Favoritos</h2>
        <p style="color: var(--text-secondary); margin-top: 4px;">
          <span id="favorites-count">0</span> produto(s) favoritado(s)
        </p>
      </div>
      <button class="btn-outline-cb" onclick="limparFavoritos()">
        <i class="bi bi-trash3"></i> Limpar favoritos
      </button>
    </div>

    <!-- ═════════════════════════════════════════════════════GRID FAVORITOS════════════════════════════════════════════════════════════ -->
    <div class="favorites-grid" id="favorites-grid"></div>

  </div>
</section>

<!-- ═════════════════════════════════════════════════════CARRINHO FLUTUANTE════════════════════════════════════════════════════════════ -->
<div class="cart-badge" onclick="irParaCarrinho()" id="cart-badge">
  <i class="bi bi-cart-fill"></i>
  <span id="cart-count">0</span>
</div>

<script src="profile.js"></script>

</body>
</html>
