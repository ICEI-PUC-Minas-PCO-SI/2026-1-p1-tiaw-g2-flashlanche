<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Meu Perfil</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png">

  <!-- SECURITY GUARD-->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="profile.css" />

</head>
<body>

<!-- ═════════════════════════════════════════════════════TOP NAV════════════════════════════════════════════════════════════ -->
<nav class="top-nav">
  <div class="container">
    <div class="nav-container">
      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark"><i class="bi bi-lightning-charge-fill"></i></div>
        <span class="logo-name">Flash<span>Lanche</span></span>
      </a>
      <div class="nav-actions">
        <button class="nav-btn" onclick="irParaLoja()"><i class="bi bi-shop"></i> Cardápio</button>
        <button class="nav-btn" onclick="irParaPedidos()"><i class="bi bi-clock-history"></i> Meus Pedidos</button>
        <button class="nav-btn login-btn" onclick="voltarHome()"><i class="bi bi-house-door"></i> Voltar</button>
        <button class="nav-btn" onclick="sair()"><i class="bi bi-box-arrow-right"></i> Sair</button>
      </div>
    </div>
  </div>
</nav>

<!-- ═════════════════════════════════════════════════════CONTEÚDO PRINCIPAL════════════════════════════════════════════════════════════ -->
<main>

  <!-- ═════════════════════════════════════════════════════PERFIL HEADER════════════════════════════════════════════════════════════ -->
  <section class="profile-container">
    <div class="container">

      <div class="profile-header">
        <div class="profile-avatar"><i class="bi bi-person-fill"></i></div>
        <div class="profile-info">
          <h1 class="h1-text" id="profile-greeting">Meu Perfil</h1>
          <p style="color: var(--text-secondary); margin-top: 6px;">Gerencie seus dados, favoritos e pedidos</p>
        </div>
      </div>

      <!-- ═════════════════════════════════════════════════════MEUS DADOS════════════════════════════════════════════════════════════ -->
      <div class="section-header">
        <div>
          <h2 class="h2-text">Meus Dados</h2>
          <p style="color: var(--text-secondary); margin-top: 4px;">Dados usados no seu cadastro e nos seus pedidos</p>
        </div>
      </div>

      <div class="account-card">
        <form id="account-form">
          <div class="account-field">
            <label class="account-label" for="account-username">Usuário</label>
            <input type="text" id="account-username" class="account-input" disabled>
          </div>

          <div class="account-field">
            <label class="account-label" for="account-email">E-mail</label>
            <input type="email" id="account-email" class="account-input" autocomplete="email" required>
          </div>

          <div class="account-field">
            <label class="account-label" for="account-telefone">Telefone</label>
            <input type="tel" id="account-telefone" class="account-input" placeholder="(31) 91234-5678" autocomplete="tel" required>
          </div>

          <div id="account-feedback" class="account-feedback" style="display:none;"></div>

          <button type="submit" class="btn-primary-cb">
            <i class="bi bi-check-circle"></i> Salvar alterações
          </button>
        </form>

        <hr class="account-divider">

        <button type="button" class="btn-outline-cb" id="toggle-password-form">
          <i class="bi bi-key"></i> Alterar senha
        </button>

        <form id="password-form" style="display:none;">
          <div class="account-field">
            <label class="account-label" for="account-current-password">Senha atual</label>
            <input type="password" id="account-current-password" class="account-input" autocomplete="current-password">
          </div>

          <div class="account-field">
            <label class="account-label" for="account-new-password">Nova senha</label>
            <input type="password" id="account-new-password" class="account-input" autocomplete="new-password" minlength="3">
          </div>

          <div class="account-field">
            <label class="account-label" for="account-confirm-password">Confirmar nova senha</label>
            <input type="password" id="account-confirm-password" class="account-input" autocomplete="new-password">
          </div>

          <div id="password-feedback" class="account-feedback" style="display:none;"></div>

          <button type="submit" class="btn-primary-cb">
            <i class="bi bi-shield-check"></i> Atualizar senha
          </button>
        </form>
      </div>

      <!-- ═════════════════════════════════════════════════════FAVORITOS HEADER════════════════════════════════════════════════════════════ -->
      <div class="section-header">
        <div>
          <h2 class="h2-text">Meus Favoritos</h2>
          <p style="color: var(--text-secondary); margin-top: 4px;">
            <span id="favorites-count">0</span> produto(s) favoritado(s)
          </p>
        </div>
        <button class="btn-outline-cb" onclick="limparFavoritos()">
          <i class="bi bi-trash3"></i> Limpar favoritos
        </button>
      </div>

      <!-- ═════════════════════════════════════════════════════GRID FAVORITOS════════════════════════════════════════════════════════════ -->
      <div class="favorites-grid" id="favorites-grid"></div>

    </div>
  </section>

</main>

<!-- ═════════════════════════════════════════════════════CARRINHO FLUTUANTE════════════════════════════════════════════════════════════ -->
<div class="cart-badge" onclick="irParaCarrinho()" id="cart-badge">
  <i class="bi bi-cart-fill"></i>
  <span id="cart-count">0</span>
</div>

<div class="tts-widget" role="region" aria-label="Controlos de Leitura de Ecrã">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>

  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
</div>

<script src="profile.js"></script>

</body>
</html>
