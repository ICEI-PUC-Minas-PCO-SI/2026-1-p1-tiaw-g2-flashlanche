<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Cardápio</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD: exige apenas estar logado -->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="shop.css" />
</head>
<body>

<!-- ═══════════════════════════ NAV ═══════════════════════════ -->
<nav class="top-nav" aria-label="Navegação principal">
  <div class="container">
    <div class="nav-container">

      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark" aria-hidden="true">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        <span class="logo-name">Flash<span>Lanche</span></span>
      </a>

      <div class="nav-actions">
        <button class="nav-btn" onclick="irParaPerfil()">
          <i class="bi bi-person-circle" aria-hidden="true"></i> Perfil
        </button>
        <button class="nav-btn" onclick="irParaPedidos()">
          <i class="bi bi-clock-history" aria-hidden="true"></i> Meus Pedidos
        </button>
        <button class="nav-btn login-btn" onclick="voltarHome()">
          <i class="bi bi-house-door" aria-hidden="true"></i> Voltar
        </button>
        <button class="nav-btn" onclick="sair()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
<main class="shop-container">
  <div class="container">

    <!-- Cabeçalho -->
    <header class="shop-header">
      <h1 class="shop-title">Cardápio</h1>
      <p style="color: var(--text-secondary); margin-top: 8px;">Escolha seus produtos favoritos</p>
    </header>

    <!-- Filtros de categoria -->
    <nav class="filter-bar" aria-label="Filtrar por categoria">
      <button class="btn-filter" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="btn-filter" onclick="filtrarCategoria('lanches')">Lanches</button>
      <button class="btn-filter" onclick="filtrarCategoria('refeições')">Refeições</button>
      <button class="btn-filter" onclick="filtrarCategoria('bebidas')">Bebidas</button>
      <button class="btn-filter" onclick="filtrarCategoria('doces')">Doces</button>
    </nav>

    <!-- Ordenação -->
    <div class="sort-container">
      <label for="sort-select" class="visually-hidden">Ordenar produtos</label>
      <select id="sort-select" onchange="ordenarProdutos()">
        <option value="padrao">Ordenar por</option>
        <option value="menor-preco">Menor preço</option>
        <option value="maior-preco">Maior preço</option>
      </select>
    </div>

    <!-- Grid de produtos -->
    <div class="product-grid" id="product-grid" role="list" aria-label="Produtos disponíveis"></div>

  </div>
</main>

<!-- ═══════════════════════════ CARRINHO FLUTUANTE ═══════════════════════════ -->
<button class="cart-badge" onclick="irParaCarrinho()" id="cart-badge" aria-label="Ver carrinho">
  <i class="bi bi-cart-fill" aria-hidden="true"></i>
  <span id="cart-count">0</span>
</button>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>

  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
    <button type="button" class="tts-close-btn" aria-label="Ocultar leitor de página" title="Ocultar leitor de página">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
</div>
<script>inicializarTTSToggle('.tts-widget');</script>

<script src="shop.js"></script>
</body>
</html>
