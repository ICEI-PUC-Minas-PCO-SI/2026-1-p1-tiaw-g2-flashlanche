<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Meus Pedidos</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="orders.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body>

<!-- ═════════════════════════════════════════════════════TOP NAV════════════════════════════════════════════════════════════ -->
<nav class="top-nav">
  <div class="container">
    <div class="nav-container">
      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark"><i class="bi bi-bag-heart-fill"></i></div>
        FlashLanche
      </a>
      <div class="nav-actions">
        <button class="nav-btn" onclick="voltarParaShop()"><i class="bi bi-shop"></i> Loja</button>
      </div>
    </div>
  </div>
</nav>

<!-- ═════════════════════════════════════════════════════PEDIDOS════════════════════════════════════════════════════════════ -->
<section class="orders-container">
  <div class="container">
    <h1 class="orders-title"><i class="bi bi-clock-history"></i> Meus Pedidos</h1>
    
    <div class="orders-grid" id="orders-grid">
      <div class="orders-empty">
        <div class="orders-empty-icon"><i class="bi bi-inbox"></i></div>
        <p style="color: var(--text-secondary); font-size: 16px;">Você ainda não fez nenhum pedido</p>
        <button class="btn-action btn-action-primary" style="margin-top: 20px;" onclick="voltarParaShop()">
          <i class="bi bi-shop"></i> Ir para Loja
        </button>
      </div>
    </div>
  </div>
</section>


<script src="../../../db/db.js"></script>
<script src="orders.js"></script>

<div class="modal-overlay" id="modal-pedido" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div class="modal-content" style="background: var(--white); border-radius: 20px; padding: 32px; text-align: center; max-width: 400px; width: 90%; position: relative;">
    
    <button onclick="fecharModal()" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary);"><i class="bi bi-x-circle"></i></button>

    <h2 style="font-size: 20px; margin-bottom: 8px;">Detalhes do Pedido</h2>
    <div class="order-id" id="modal-pedido-id" style="font-size: 24px; margin-bottom: 24px;">---</div>
    
    <div id="modal-status-badge" style="margin-bottom: 24px;"></div>

    <div style="background: var(--canvas); border-radius: 12px; padding: 16px; margin-bottom: 24px; text-align: left;">
      <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;"><i class="bi bi-clock"></i> Horário de Retirada: <b id="modal-pedido-horario" style="color: var(--text-primary);">--:--</b></div>
      <div style="font-size: 14px; color: var(--text-secondary);"><i class="bi bi-box-seam"></i> Total: <b id="modal-pedido-total" style="color: var(--text-primary);">R$ 0.00</b></div>
    </div>

    <div id="modal-qr-container" style="display: flex; justify-content: center; margin-bottom: 24px;">
      <div id="qr-code-canvas" style="border: 2px solid var(--orange); border-radius: 14px; padding: 12px; background: white;"></div>
    </div>

    <p id="modal-qr-aviso" style="color: var(--text-secondary); font-size: 13px; margin-bottom: 0;">Apresente este QR Code no balcão para retirar seu lanche.</p>

  </div>
</div>

<div class="tts-widget" role="region" aria-label="Controlos de Leitura de Ecrã">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>
  
  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
</div>

</body>
</html>
