<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Meus Pedidos</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD-->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="orders.css" />
</head>
<body>

<!-- ═══════════════════════════ NAV ═══════════════════════════ -->
<nav class="top-nav" aria-label="Navegação principal">
  <div class="container">
    <div class="nav-container">

      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark" aria-hidden="true">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        FlashLanche
      </a>

      <div class="nav-actions">
        <button class="nav-btn" onclick="voltarParaShop()">
          <i class="bi bi-shop" aria-hidden="true"></i> Loja
        </button>
        <button class="nav-btn" onclick="sair()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
<main class="orders-container">
  <div class="container">

    <h1 class="orders-title">
      <i class="bi bi-clock-history" aria-hidden="true"></i> Meus Pedidos
    </h1>

    <!-- Grid de pedidos (preenchido via JS; estado vazio inicial) -->
    <div class="orders-grid" id="orders-grid" role="list" aria-label="Lista de pedidos">
      <div class="orders-empty">
        <div class="orders-empty-icon" aria-hidden="true">
          <i class="bi bi-inbox"></i>
        </div>
        <p class="orders-empty-text">Você ainda não fez nenhum pedido</p>
        <button class="btn-action btn-action-primary orders-empty-action" onclick="voltarParaShop()">
          <i class="bi bi-shop" aria-hidden="true"></i> Ir para Loja
        </button>
      </div>
    </div>

  </div>
</main>

<!-- ═══════════════════════════ MODAL DE DETALHES ═══════════════════════════ -->
<div
  class="modal-overlay"
  id="modal-pedido"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-titulo"
  aria-hidden="true"
  style="display: none;"
>
  <div class="modal-content">

    <button class="modal-close" id="modal-fechar" onclick="fecharModal()" aria-label="Fechar detalhes do pedido">
      <i class="bi bi-x-circle" aria-hidden="true"></i>
    </button>

    <h2 class="modal-title" id="modal-titulo">Detalhes do Pedido</h2>
    <div class="modal-order-id" id="modal-pedido-id">---</div>

    <div class="modal-status-wrap" id="modal-status-badge"></div>

    <div class="modal-info-box">
      <div class="modal-info-row">
        <i class="bi bi-clock" aria-hidden="true"></i>
        Horário de Retirada:
        <span class="modal-info-value" id="modal-pedido-horario">--:--</span>
      </div>
      <div class="modal-info-row">
        <i class="bi bi-box-seam" aria-hidden="true"></i>
        Total:
        <span class="modal-info-value" id="modal-pedido-total">R$ 0.00</span>
      </div>
    </div>

    <div class="modal-qr-container" id="modal-qr-container">
      <div class="modal-qr-box" id="qr-code-canvas"></div>
    </div>

    <p class="modal-qr-aviso" id="modal-qr-aviso">
      Apresente este QR Code no balcão para retirar seu lanche.
    </p>

  </div>
</div>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>
  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
</div>

<script src="../../../db/db.js"></script>
<script src="orders.js"></script>
</body>
</html>
