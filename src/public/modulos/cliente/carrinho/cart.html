<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashLanche - Carrinho</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/favicon.png" />

  <!-- SECURITY GUARD: exige apenas estar logado -->
  <script src="../../../db/auth.js"></script>
  <script>
    protegerRota({ caminhoLogin: '../../auth/login/login.html', caminhoHome: '../../../index.html' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="cart.css" />
</head>
<body>

<!-- ═══════════════════════════ NAV ═══════════════════════════ -->
<nav class="top-nav" aria-label="Navegação principal">
  <div class="container">
    <div class="nav-container">

      <a href="../../../index.html" class="nav-logo">
        <div class="nav-logo-mark" aria-hidden="true">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        FlashLanche
      </a>

      <div class="nav-actions">
        <button class="nav-btn" onclick="voltarParaShop()">
          <i class="bi bi-shop" aria-hidden="true"></i> Continuar Comprando
        </button>
        <button class="nav-btn" onclick="sair()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- ═══════════════════════════ CONTEÚDO PRINCIPAL ═══════════════════════════ -->
<main class="cart-container">
  <div class="container">

    <h1 class="cart-title">
      <i class="bi bi-cart-fill" aria-hidden="true"></i> Seu Carrinho
    </h1>

    <div class="cart-layout">

      <!-- Lista de itens (preenchida via JS) -->
      <div class="cart-items" id="cart-items-container" role="list" aria-label="Itens no carrinho">
        <div class="cart-empty">
          <p class="cart-empty-icon"><i class="bi bi-inbox" aria-hidden="true"></i></p>
          <p>Seu carrinho está vazio</p>
          <button class="btn-checkout btn-checkout--auto" onclick="voltarParaShop()">Ir para a Loja</button>
        </div>
      </div>

      <!-- Resumo do pedido -->
      <aside class="cart-summary" aria-label="Resumo do pedido">
        <h2 style="margin-bottom: 20px; font-weight: 700; font-size: 18px;">Resumo do Pedido</h2>

        <!-- Cupom -->
        <div class="coupon-box">
          <label class="summary-label" for="input-cupom" style="display: block; margin-bottom: 8px; font-size: 13px;">
            Possui cupom de desconto?
          </label>
          <div class="coupon-row">
            <input type="text" id="input-cupom" class="coupon-input" placeholder="Digite o código" />
            <button class="btn-apply" onclick="aplicarCupom()">Aplicar</button>
          </div>
          <div id="cupom-msg" class="coupon-msg" aria-live="polite"></div>
        </div>

        <!-- Valores -->
        <div class="summary-row">
          <span class="summary-label">Subtotal</span>
          <span class="summary-value">R$ <span id="subtotal">0.00</span></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Taxa (0%)</span>
          <span class="summary-value">R$ <span id="taxa">0.00</span></span>
        </div>

        <div class="summary-row" id="row-desconto" style="display: none;">
          <span class="summary-label" style="color: var(--green); font-weight: 600;">Desconto Aplicado</span>
          <span class="summary-value" style="color: var(--green);">− R$ <span id="valor-desconto">0.00</span></span>
        </div>

        <div class="summary-total">
          <span>Total</span>
          <span>R$ <span id="total">0.00</span></span>
        </div>

        <!-- Ações -->
        <button class="btn-checkout" onclick="irParaCheckout()" id="btn-checkout" disabled>
          <i class="bi bi-credit-card" aria-hidden="true"></i> Ir para Checkout
        </button>

        <button class="btn-checkout btn-checkout--secondary" onclick="limparCarrinho()">
          <i class="bi bi-trash" aria-hidden="true"></i> Limpar Carrinho
        </button>
      </aside>

    </div>
  </div>
</main>

<!-- ═══════════════════════════ ACESSIBILIDADE — TTS ═══════════════════════════ -->
<div class="tts-widget" role="region" aria-label="Leitor de página">
  <div class="tts-label" aria-hidden="true">
    <i class="bi bi-universal-access-circle"></i> Leitor de Página
  </div>

  <div class="tts-controls">
    <button id="tts-play-pause" class="tts-btn" aria-label="Iniciar narração da página" onclick="toggleLeitura()">
      <i class="bi bi-play-circle-fill"></i>
    </button>
    <button id="tts-stop" class="tts-btn tts-stop" aria-label="Parar narração" onclick="pararLeitura()" disabled>
      <i class="bi bi-stop-circle-fill"></i>
    </button>
  </div>
    <button type="button" class="tts-close-btn" aria-label="Ocultar leitor de página" title="Ocultar leitor de página">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
</div>
<script>inicializarTTSToggle('.tts-widget');</script>

<script src="../../../db/db.js"></script>
<script src="cart.js"></script>
</body>
</html>
